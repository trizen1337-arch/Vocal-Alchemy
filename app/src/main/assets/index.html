<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#11131b"><title>Vocal Alchemy</title>
<style>body{margin:0;background:#101218;color:#f5f5f7;font:16px system-ui}header{padding:22px;background:#1a1e29;font-weight:700}main{padding:22px}.card{background:#1c2230;border-radius:18px;padding:20px;margin:16px 0}small{color:#a8b0c1}button{background:#e0b96b;border:0;border-radius:12px;padding:14px;font-weight:700}</style></head>
<body><header>Vocal Alchemy · Android Alpha</header><main><div class="card"><h2>Android foundation ready</h2><p>This is the native Android shell, not the full DAW yet.</p><small>The existing Vocal Alchemy workspace will be integrated into this secure offline WebView in the next step.</small></div><div class="card"><h3>Microphone permission check</h3><button id="mic">Test microphone access</button><p id="status">Not requested</p></div></main>
<script>document.querySelector('#mic').onclick=async()=>{const s=document.querySelector('#status');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});s.textContent='Microphone permission granted';stream.getTracks().forEach(t=>t.stop())}catch(e){s.textContent='Microphone unavailable: '+e.message}}</script></body></html>
